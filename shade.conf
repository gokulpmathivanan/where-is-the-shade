server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's mime.types doesn't know .webmanifest — without this it goes out
    # as octet-stream and the install prompt can silently fail
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # These two must never be served stale (by Cloudflare's edge or the
    # browser), or updates lag behind your git pulls. Cloudflare respects
    # origin Cache-Control, so no-cache here keeps the edge honest too.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
